services:
  dollarbaan-plus:
    build: .
    image: dollarbaan-plus:latest
    container_name: dollarbaan-plus
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_PATH: /app/data/database.sqlite
      LOG_DIR: "off"
    volumes:
      - dollarbaan-plus-data:/app/data

volumes:
  dollarbaan-plus-data:
